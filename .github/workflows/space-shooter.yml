name: Space Shooter

on:
  schedule:
    # Every half hour, offset off :00/:30 on purpose: GitHub throttles
    # scheduled jobs hardest on the hour, so they run late or get dropped.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: space-shooter
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate the animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/index.js --user "${{ github.repository_owner }}" --out dist

      - name: Skip if the graph has not changed
        id: check
        run: |
          set -e
          # The render is deterministic, so identical contribution data yields
          # byte-identical SVGs. Only republish when something actually moved.
          if git fetch --depth=1 origin output 2>/dev/null \
             && git show origin/output:space-shooter-dark.svg > "$RUNNER_TEMP/prev.svg" 2>/dev/null \
             && cmp -s "$RUNNER_TEMP/prev.svg" dist/space-shooter-dark.svg; then
            echo "unchanged, nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the output branch
        if: steps.check.outputs.changed == 'true'
        run: |
          set -e
          cp dist/*.svg "$RUNNER_TEMP/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The output branch holds nothing but the generated SVGs, rewritten
          # from scratch each run so its history never grows unbounded.
          git checkout --orphan output
          git rm -rf -q . || true
          cp "$RUNNER_TEMP"/*.svg .
          git add -f ./*.svg
          git commit -m "chore: regenerate space shooter [skip ci]"
          git push -f origin output
